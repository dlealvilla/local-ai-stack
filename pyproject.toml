[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kultrun"
version = "0.1.0"
description = "Kultrun — Company Brain Platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kultrun = "kultrun.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "hatchling>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/kultrun"]
# The build identity is gitignored so an interrupted build cannot commit a
# stale commit reference, but it must still ship inside the wheel — that is
# the only way a deployed instance can say which source state produced it.
# `artifacts` is hatchling's escape hatch for exactly this: include even
# though VCS ignores it. Without it the wheel builds fine and every deployed
# instance silently reports itself as a source checkout.
artifacts = ["src/kultrun/BUILD.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W",   # pyflakes, pycodestyle
    "I",             # import sorting
    "N",             # naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "A",             # shadowed builtins
    "C4",            # comprehensions
    "PIE", "RET", "SIM", "TID", "PTH", "PT", "RUF",
]
ignore = [
    "SIM108",   # a ternary is not always clearer
    "RET505",   # else-after-return reads fine when branches are parallel
    # schema.meaning() wraps dataclasses.field(); calling it in a field
    # default is the whole contract convention, not a mutable-default bug.
    "RUF009",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801"]   # fixture contract names mirror wire kinds

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "tools"]
mypy_path = "src"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
